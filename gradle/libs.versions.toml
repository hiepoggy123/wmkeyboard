[versions]
agp = "9.3.0"
kotlin = "2.2.20"
coreKtx = "1.16.0"
profileinstaller = "1.4.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
activityCompose = "1.10.1"
composeBom = "2025.06.00"
lifecycle = "2.9.0"
datastore = "1.1.7"
serializationJson = "1.8.1"
coroutines = "1.10.2"
emoji2 = "1.5.0"
autofill = "1.1.0"
navigationCompose = "2.9.0"
mlkitDigitalInk = "19.0.0"
mlkitTextRecognition = "16.0.1"
mlkitBarcode = "17.3.0"
mlkitDocScanner = "16.0.0"
# Unbundled: the model is downloaded from Play services on first use, so
# nothing ships in the APK. Still beta upstream; there is no stable line.
mlkitSubjectSegmentation = "16.0.0-beta1"
camerax = "1.4.2"
# 3.5.x ships Kotlin 2.4 metadata, unreadable by this project's Kotlin 2.2.
coil = "3.2.0"
# Already in the APK as Coil's network engine; declared here so the WebDAV
# backup sink can use it directly. HttpURLConnection cannot: it validates the
# request method against a fixed list and rejects PROPFIND and MOVE outright.
okhttp = "4.12.0"
zxing = "3.5.3"
litertlm = "0.14.0"
# 2.x splits into litert + litert-api sharing one namespace, which AGP's
# manifest merger rejects; 1.4.2 is the last single-artifact classic runtime
# (org.tensorflow.lite.Interpreter + signature runners).
litert = "1.4.2"
# Lua interpreter for the plugin sandbox. Pure JVM, MIT, no transitive deps.
# 3.0.1 is the LAST version published to Maven Central — the 3.0.2 git tag was
# never released as an artifact. Do not bump without re-auditing PluginSandbox:
# it depends on interpreter internals (which exceptions pcall catches, the
# DebugLib.onInstruction hook path, the process-global LuaString.s_metatable)
# that no public API pins down.
luaj = "3.0.1"
# Play In-App Updates, the only piece of Play Core this app links. It reaches
# the APK *only* when the build is a Play-channel build
# (-Pwmkb.enablePlayStore=true) — see app/build.gradle.kts, which swaps the
# source directory as well as the dependency. 2.1.0 is the current release of
# the split-out app-update artifact; the old monolithic `play:core` is
# deprecated and must not be used. The companion `app-update-ktx` is
# deliberately absent: its whole contribution is a suspend wrapper around one
# Task, and it drags androidx.fragment into an app that has no fragments.
playAppUpdate = "2.1.0"
playServicesAuth = "21.3.0"
# Static analysis. detekt 2.x is still alpha; 1.23.8 is the last stable line and
# parses this project's Kotlin fine (no context receivers / `when` guards here).
detekt = "1.23.8"
# Slack's Compose lint checks: Android Lint rules for @Composable correctness
# (unstable parameters, unremembered mutable state, modifier misuse, ...).
composeLints = "1.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate-ktx", version = "1.3.0" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-emoji2 = { group = "androidx.emoji2", name = "emoji2", version.ref = "emoji2" }
# Inline autofill: UiVersions / InlineSuggestionUi for the presentation spec.
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
mlkit-digital-ink = { group = "com.google.mlkit", name = "digital-ink-recognition", version.ref = "mlkitDigitalInk" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocScanner" }
mlkit-subject-segmentation = { group = "com.google.android.gms", name = "play-services-mlkit-subject-segmentation", version.ref = "mlkitSubjectSegmentation" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
luaj-jse = { group = "org.luaj", name = "luaj-jse", version.ref = "luaj" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "playAppUpdate" }
# Only the AuthorizationClient half is used, to get an OAuth token for the
# Drive backup destination. Behind the wmkb.enableGms seam; never on F-Droid.
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Static-analysis rule packs, pulled in via the detektPlugins / lintChecks
# configurations rather than compiled into the app.
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLints" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
