# Pinned rather than left to Robolectric's own default, for two reasons: this
# module's compileSdk is a *minor* API level (36.1) and no android-all jar is
# published for one, and a library module has no targetSdk under AGP 9 for
# Robolectric to read. 34 is the newest level with a long-settled jar, and the
# keyboard's minSdk is 24, so nothing under test cares which of the two it is.
sdk=34
