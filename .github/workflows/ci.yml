name: CI

on:
  push:
    branches: [main, 'sync/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every channel flag off: this is the plain sideload build, so no Google
  # binary is on the compile classpath and CI never needs a Play SDK.
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Run unit tests
        # `unitTests` and not a bare testFullIntlDebugUnitTest: :app carries the
        # `languages` flavour and the library modules do not, so no single
        # flavoured task name reaches both. The aggregate in the root build
        # does.
        # `--continue` ensures all tests across all modules run even if some fail.
        run: ./gradlew unitTests -Pwmkb.skipBenchmarks=true --continue --stacktrace

      - name: Summarize test results
        if: always()
        run: |
          python3 -c "
          import os, sys, glob, xml.etree.ElementTree as ET

          try:
              if hasattr(sys.stdout, 'reconfigure'):
                  sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          except Exception:
              pass

          results = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          failed_cases = []

          for f in results:
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  total_tests += int(root.attrib.get('tests', 0))
                  total_failures += int(root.attrib.get('failures', 0))
                  total_errors += int(root.attrib.get('errors', 0))
                  total_skipped += int(root.attrib.get('skipped', 0))
                  for tc in root.findall('testcase'):
                      fail = tc.find('failure')
                      err = tc.find('error')
                      if fail is not None or err is not None:
                          node = fail if fail is not None else err
                          classname = tc.attrib.get('classname', '')
                          name = tc.attrib.get('name', '')
                          msg = node.attrib.get('message', '') or (node.text or '').split('\n')[0]
                          failed_cases.append((classname, name, msg.strip()))
              except Exception:
                  pass

          passed = total_tests - total_failures - total_errors - total_skipped

          md = []
          md.append('# 📊 Unit Test Summary (Lite Intl)')
          md.append('| Tong so test | Passed [OK] | Failed [X] | Errors [!] | Skipped [->] |')
          md.append('| --- | --- | --- | --- | --- |')
          md.append(f'| **{total_tests}** | **{passed}** | **{total_failures}** | **{total_errors}** | **{total_skipped}** |')
          md.append('')

          if failed_cases:
              md.append(f'### ❌ Danh sach {len(failed_cases)} bai test bi FAIL:')
              md.append('| Class | Test Method | Chi tiet loi |')
              md.append('| --- | --- | --- |')
              for cls, test, msg in failed_cases:
                  cls_short = cls.split('.')[-1]
                  clean_msg = msg.replace('|', '\\|')[:140]
                  md.append(f'| `{cls_short}` | `{test}` | {clean_msg} |')
          else:
              md.append('### 🎉 Tat ca cac bai test da PASSED thanh cong!')

          summary_text = '\n'.join(md)
          try:
              print(summary_text)
          except Exception:
              pass

          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              try:
                  with open(summary_file, 'a', encoding='utf-8') as sf:
                      sf.write(summary_text + '\n')
              except Exception as e:
                  print('Could not write GITHUB_STEP_SUMMARY:', e)
          "

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # Four jobs rather than two now that `languages` is a flavour dimension.
  # They run on separate runners at the same time, so the wall clock is what it
  # was; only the runner minutes double. The English build is here to prove the
  # localeFilters path still packages, which nothing else would catch before a
  # release was already being cut.
  assemble:
    name: Assemble ${{ matrix.capability }} ${{ matrix.language }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        capability: [lite]
        language: [intl]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Capitalised and joined: assembleFullIntlDebug, assembleLiteEnDebug.
      # AGP names the output directory the same way, minus the build type:
      # app/build/outputs/apk/fullIntl/debug/.
      - name: Assemble
        run: |
          capability='${{ matrix.capability }}'
          language='${{ matrix.language }}'
          variant="${capability}${language^}"
          # Exported because the upload step needs the same capitalisation and
          # a GitHub expression cannot produce it: joining the two matrix
          # values would spell the directory "fullintl". (No expression syntax
          # in this comment: Actions evaluates it inside run blocks too.)
          echo "VARIANT_DIR=$variant" >> "$GITHUB_ENV"
          ./gradlew "assemble${capability^}${language^}Debug" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.capability }}-${{ matrix.language }}-debug
          path: app/build/outputs/apk/${{ env.VARIANT_DIR }}/debug/*.apk
          retention-days: 7

  # ART never compiles a method of 10,000 dex instructions or more, and runs
  # one with a frame over 3 KB in its slow interpreter until the JIT gets to
  # it. Nothing else notices either: the keyboard just types slower. Reads the
  # dex of a `fast` build (release-mode d8, no R8, so the names are readable).
  # English only, because the dex is the same in both language flavours.
  # Licences for lite edition.
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Lite release
        run: ./gradlew :app:licenseeAndroidLiteIntlRelease --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensee
          path: app/build/reports/licensee/
          retention-days: 7

