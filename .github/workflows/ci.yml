name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every channel flag off: this is the plain sideload build, so no Google
  # binary is on the compile classpath and CI never needs a Play SDK.
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  assemble:
    name: Assemble ${{ matrix.flavor }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Capitalised task name: assembleFullDebug / assembleLiteDebug.
      - name: Assemble
        run: |
          flavor='${{ matrix.flavor }}'
          ./gradlew "assemble${flavor^}Debug" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 7

  # Accuracy floors move when a dictionary or a ranking weight changes, which
  # is a review conversation and not a merge blocker. Reported, never gating.
  eval:
    name: Prediction & gesture evals (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Scoped to :app because that is where the eval suites live. An
      # unqualified task name would run the filter against every module too,
      # and a Test task whose --tests filter matches nothing fails the build.
      - name: Run evals
        run: >
          ./gradlew :app:testFullDebugUnitTest
          --tests '*.prediction.eval.*' --tests '*.gesture.eval.*'
          -Pwmkb.skipBenchmarks=true --stacktrace

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      # CHECK_LINKS=1 turns on starlight-links-validator, so a broken internal
      # link fails here instead of shipping to Pages.
      - run: npm run check
        working-directory: docs
