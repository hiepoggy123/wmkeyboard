name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Essential unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - name: Run essential unit tests
        # Runs focused unit tests for Core and IME (Vietnamese, SuggestionEngine, Orthography, Settings)
        run: >
          ./gradlew :core:settings:test :core:input:test :core:prediction:test
          :feature:ime:testDebugUnitTest --tests "*Vietnamese*"
          -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  assemble-release-lite:
    name: Assemble ARM64 Release Lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - name: Assemble Release Lite (arm64-v8a)
        run: ./gradlew assembleLiteRelease -Pwmkb.enableFdroid=true -Pwmkb.abi=arm64-v8a -Pwmkb.signReleaseWithDebug=true -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload Release Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: wmkeyboard-arm64-release-lite
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/intl/release/*.apk
          retention-days: 14
