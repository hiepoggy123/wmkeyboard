name: Build Release APK

# Trigger on every push to any branch and on pull requests.
# This builds signed release APKs so you always have an installable
# artifact without needing to tag a release.
on:
  push:
    branches: ['**']
    # Don't duplicate work when a tag push already triggers release.yml
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  # Sideload build — no Play Store or GMS dependencies needed.
  WMKB_ENABLE_PLAY_STORE: 'false'
  WMKB_ENABLE_GMS: 'false'

jobs:
  build-release-apk:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "::notice::Using configured keystore from secrets."
          else
            echo "::notice::KEYSTORE_BASE64 secret is not set. Generating temporary self-signed keystore for installable release APK."
            keytool -genkeypair -v -keystore release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass wmkeyboard -keypass wmkeyboard -dname "CN=WMKeyboard, OU=Mod, O=WM, L=Unknown, S=Unknown, C=VN"
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=wmkeyboard" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=releaseKey" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=wmkeyboard" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (arm64 only)
        run: |
          set -o pipefail
          ./gradlew assembleIntlRelease -Pwmkb.abi=arm64-v8a -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace 2>&1 | tee gradle-build.log

      - name: Output error to Step Summary on failure
        if: failure()
        run: |
          echo "## Gradle Build Failure" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 250 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Collect artifacts
        run: |
          version=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' | while read -r apk; do
            filename=$(basename "$apk")
            cp "$apk" "dist/wmkeyboard-${version}-vc${code}-${sha}-${filename}"
          done
          ls -lh dist/

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: dist/*.apk
          retention-days: 14
