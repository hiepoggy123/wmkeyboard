name: Release

# Tag a commit `v0.3.0` and push it. The tag must match wmkb.versionName in
# gradle.properties or the first job stops the run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but do not publish a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          declared=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            tag='${{ github.ref_name }}'
            if [ "v$declared" != "$tag" ]; then
              echo "::error::Tag $tag does not match wmkb.versionName=$declared"
              exit 1
            fi
          fi
          echo "Releasing $declared"

  apks:
    name: Signed APKs (direct download)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The signing block resolves RELEASE_STORE_FILE against the repo root, so
      # the keystore is written there and never leaves the runner.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Release builds must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # splitApks=true gives one APK per ABI instead of one fat universal APK,
      # which is what the download page wants. Play channel off: this build must
      # not carry the in-app-update library, since it only works via Play.
      - name: Build release APKs
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          WMKB_ENABLE_PLAY_STORE: 'false'
          WMKB_ENABLE_GMS: 'true'
          WMKB_SPLIT_APKS: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
        run: ./gradlew assembleFullRelease assembleLiteRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*-release.apk' -exec cp {} dist/ \;
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/
          retention-days: 30

  bundle:
    name: Play bundle (artifact only)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # Play channel on: unbundled ML Kit, in-app updates, and :feature:llm as
      # an on-demand module. bundle<Variant> ignores the ABI split block.
      - name: Build AAB
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          WMKB_ENABLE_PLAY_STORE: 'true'
          WMKB_ENABLE_GMS: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
        run: ./gradlew bundleFullRelease --stacktrace

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      # Deliberately not attached to the GitHub release: an AAB is not
      # installable, and uploading to Play stays a decision you make by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: app/build/outputs/bundle/fullRelease/*.aab
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [verify, apks]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: WM Keyboard ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            Install the APK that matches your phone's CPU. `arm64-v8a` is
            right for essentially every phone sold since 2017.

            **full** is the complete build. **lite** drops the ML Kit and
            on-device model features (handwriting, OCR, document scanning,
            Whisper, the local LLM) for a much smaller download.

            Verify what you downloaded against `SHA256SUMS.txt`.
